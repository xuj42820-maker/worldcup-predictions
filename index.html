  <script>
    const docs = {"doc-0":"<p><strong>2026 FIFA 世界杯</strong></p><p><strong>6月29日 16强战预测报告</strong></p><p>淘汰赛首轮 | 4场比赛</p><p><strong>模型版本 v3.4（平衡模式 + Deep Prediction 融合）</strong></p><p>v3.4 升级要点：双方战意场景修正 + 防守崩溃系数上调 + 战意权重提升至12%</p><p>v3.1 公式：xG = 场均进球 × (对手场均失球/1.35) × 阶段系数 × 1.12（世界杯膨胀）</p><p>预测时间：2026年6月28日</p><h1><strong>一、模型说明 v3.4</strong></h1><p><strong>v3.4 模型相对 v3.3 的核心升级（基于6月27日哥伦比亚vs葡萄牙复盘）：</strong></p><table><tr><td><p><strong>模块</strong></p></td><td><p><strong>v3.3</strong></p></td><td><p><strong>v3.4 升级</strong></p></td></tr><tr><td><p>权重</p></td><td><p>ELO 25% / 状态22%</p></td><td><p>ELO 23% / 状态22% / 战意12% / 阵容12%</p></td></tr><tr><td><p>轮换影响</p></td><td><p>进攻-25%~-35%</p></td><td><p>已出线+教练有轮换史 额外-10%~-15%</p></td></tr><tr><td><p>双方都需赢球</p></td><td><p>未量化</p></td><td><p>总进球+30%~+40%，平局+3%~+5%</p></td></tr><tr><td><p>双方都无压力</p></td><td><p>未量化</p></td><td><p>总进球-20%~-30%，平局+5%~+8%</p></td></tr><tr><td><p>防守崩溃系数</p></td><td><p>橙1.35 / 红1.4</p></td><td><p>橙1.5 / 红1.6</p></td></tr><tr><td><p>验证案例</p></td><td><p>塞内加尔5-0伊拉克</p></td><td><p>巴拿马0-2英格兰精准命中</p></td></tr></table><p><strong>淘汰赛阶段适用规则：</strong></p><p>• 不适用「轮换影响」模块（淘汰赛无轮换空间）</p><p>• 大赛经验加成系数 ×1.0（淘汰赛全额加成）</p><p>• 战意默认接近最高值（输了回家）</p><p>• 平局概率封顶 35%</p><p>• 90分钟内胜平负概率，不含加时/点球</p><h1><strong>二、四场比赛预测汇总</strong></h1><table><tr><td><p><strong>比赛</strong></p></td><td><p><strong>xG</strong></p></td><td><p><strong>胜/平/负</strong></p></td><td><p><strong>首选比分</strong></p></td><td><p><strong>大2.5</strong></p></td><td><p><strong>信心</strong></p></td><td><p><strong>爆冷</strong></p></td></tr><tr><td><p>加拿大 VS 南非</p></td><td><p>2.14 / 0.79</p></td><td><p>66.2% / 19.0% / 14.8%</p></td><td><p>2-0</p></td><td><p>53.9%</p></td><td><p>7.5/10</p></td><td><p>30/100 轻微</p></td></tr><tr><td><p>巴西 VS 日本</p></td><td><p>2.32 / 0.79</p></td><td><p>68.6% / 17.2% / 14.2%</p></td><td><p>2-0</p></td><td><p>57.0%</p></td><td><p>8.0/10</p></td><td><p>20/100 低</p></td></tr><tr><td><p>德国 VS 巴拉圭</p></td><td><p>2.32 / 0.55</p></td><td><p>74.2% / 15.6% / 10.2%</p></td><td><p>2-0</p></td><td><p>51.6%</p></td><td><p>8.5/10</p></td><td><p>15/100 极低</p></td></tr><tr><td><p>荷兰 VS 摩洛哥</p></td><td><p>1.00 / 1.01</p></td><td><p>31.6% / 35.0% / 33.4%</p></td><td><p>1-1</p></td><td><p>32.5%</p></td><td><p>5.0/10</p></td><td><p>50/100 中等</p></td></tr></table><p><strong>综合推荐</strong></p><p>• 比赛1 加拿大 VS 南非：加拿大胜 + 大2.5球（高信心 7.5/10，东道主优势）</p><p>• 比赛2 巴西 VS 日本：巴西胜 + 大2.5球（高信心 8.0/10）</p><p>• 比赛3 德国 VS 巴拉圭：德国胜 + 让1球 + 大2.5球（最高信心 8.5/10）</p><p>• 比赛4 荷兰 VS 摩洛哥：平局 + 小2.5球（中等信心 5.0/10，爆冷概率高）</p><h1><strong>比赛1：加拿大 VS 南非</strong></h1><p>16强战 | 北京时间6月29日 03:00 | SoFi Stadium（洛杉矶 — 加拿大享联合东道主优势）</p><h2><strong>基础数据</strong></h2><table><tr><td><p><strong>指标</strong></p></td><td><p><strong>加拿大</strong></p></td><td><p><strong>南非</strong></p></td></tr><tr><td><p>FIFA排名</p></td><td><p>第30位左右</p></td><td><p>第55位左右</p></td></tr><tr><td><p>ELO评分</p></td><td><p>≈1720</p></td><td><p>≈1530</p></td></tr><tr><td><p>实力综合分（原始）</p></td><td><p>7.30</p></td><td><p>6.64</p></td></tr><tr><td><p>实力差</p></td><td><p>0.66 → 实力接近</p></td><td><p>—</p></td></tr><tr><td><p>大赛经验加成</p></td><td><p>近3届16强 → +2%</p></td><td><p>近3届16强 → +2%</p></td></tr><tr><td><p>实力分（经验调整后）</p></td><td><p>7.45</p></td><td><p>6.77</p></td></tr><tr><td><p>经验调整后实力差</p></td><td><p>差0.68 → 实力接近</p></td><td><p>—</p></td></tr></table><h2><strong>Deep Prediction 极端因子检测</strong></h2><table><tr><td><p><strong>因子</strong></p></td><td><p><strong>触发情况</strong></p></td><td><p><strong>调整幅度</strong></p></td></tr><tr><td><p>东道主士气溢出</p></td><td><p>加拿大为联合东道主+SoFi本土</p></td><td><p>加拿大进攻+12%/防守+8%</p></td></tr><tr><td><p>破大巴能力</p></td><td><p>戴维斯个人突破能力顶级</p></td><td><p>加拿大+5%</p></td></tr><tr><td><p>压力系数</p></td><td><p>淘汰赛强队进攻</p></td><td><p>加拿大+3%</p></td></tr></table><p><strong>5个平局触发条件检测：</strong></p><p>• 原本接近(差&lt;15%)但东道主加成后xG差扩大至63%，平局触发不再生效</p><h2><strong>xG 计算（v3.1 新公式）</strong></h2><p>加拿大：加拿大1.7 → ×(1.2/1.35)×1.05×1.12 = 1.78，叠加东道主+12%/破大巴+5%/淘汰赛+3% = ×1.20 → 2.14</p><p>南非：南非1.1 → ×(0.9/1.35)×1.05×1.12 = 0.86，叠加加拿大东道主防守+8%反向调整 = ×0.92 → 0.79</p><p><strong>最终调整后 xG：加拿大 2.14 / 南非 0.79</strong></p><h2><strong>胜平负概率（90分钟内）</strong></h2><table><tr><td><p><strong>结果</strong></p></td><td><p><strong>概率</strong></p></td></tr><tr><td><p>加拿大胜</p></td><td><p>66.2%</p></td></tr><tr><td><p>平局</p></td><td><p>19.0%</p></td></tr><tr><td><p>南非胜</p></td><td><p>14.8%</p></td></tr></table><p><strong>赔率对比：</strong></p><table><tr><td><p><strong>项目</strong></p></td><td><p><strong>主胜</strong></p></td><td><p><strong>平局</strong></p></td><td><p><strong>客胜</strong></p></td></tr><tr><td><p>市场赔率/隐含</p></td><td><p>CAN -155 / 60.8%</p></td><td><p>26.7%</p></td><td><p>12.5%</p></td></tr><tr><td><p>模型概率</p></td><td><p>66.2%</p></td><td><p>19.0%</p></td><td><p>14.8%</p></td></tr></table><p>差值评估：模型66.2% vs 市场60.8%，差5.4% 一致</p><h2><strong>最可能比分 TOP5</strong></h2><table><tr><td><p><strong>排名</strong></p></td><td><p><strong>比分</strong></p></td><td><p><strong>概率</strong></p></td></tr><tr><td><p>1</p></td><td><p>2-0</p></td><td><p>12.2%</p></td></tr><tr><td><p>2</p></td><td><p>1-0</p></td><td><p>11.4%</p></td></tr><tr><td><p>3</p></td><td><p>2-1</p></td><td><p>9.7%</p></td></tr><tr><td><p>4</p></td><td><p>1-1</p></td><td><p>9.0%</p></td></tr><tr><td><p>5</p></td><td><p>3-0</p></td><td><p>8.7%</p></td></tr></table><h2><strong>让球胜平负</strong></h2><table><tr><td><p><strong>盘口</strong></p></td><td><p><strong>概率</strong></p></td></tr><tr><td><p>加拿大-0.5（主胜）</p></td><td><p>66.2%</p></td></tr><tr><td><p>加拿大-1（净胜2+）</p></td><td><p>42.0%</p></td></tr><tr><td><p>加拿大-1.5（净胜2+）</p></td><td><p>42.0%</p></td></tr></table><h2><strong>进球数（大小球）</strong></h2><table><tr><td><p><strong>盘口</strong></p></td><td><p><strong>大球概率</strong></p></td><td><p><strong>小球概率</strong></p></td></tr><tr><td><p>大/小1.5球</p></td><td><p>76.8%</p></td><td><p>23.2%</p></td></tr><tr><td><p>大/小2.5球</p></td><td><p>53.9%</p></td><td><p>46.1%</p></td></tr><tr><td><p>大/小3.5球</p></td><td><p>31.5%</p></td><td><p>68.5%</p></td></tr></table><h2><
